  - title: Version Control
    text: Version control is one of the most important tools in a programmers toolbox. That's why i regularly use Git in both personal and professional endeavors either with a GUI or directly with GitBash.
    icons:
      - icon: https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/git/git-original-wordmark.svg
