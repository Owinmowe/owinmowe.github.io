about_values:
  - title: Code
    text: As a game programmer, i'm well versed in all the most used code languages in the game development industry (either in conjuction with an engine or standalone).
    icons:
      - icon: https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/csharp/csharp-original.svg
      - icon: https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/cplusplus/cplusplus-original.svg
      - icon: https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/opengl/opengl-plain.svg

  - title: Engines
    text: I'm a big believer that if the fundamentals are right, the engine is just a tool to get to an end. That's why i have experience in several industry standard engines and even engine development from the ground up with OpenGL.
    icons:
      - icon: https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/unity/unity-original-wordmark.svg
      - icon: https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/unrealengine/unrealengine-original-wordmark.svg
