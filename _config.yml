projects:
  - title: Undermire <small>(Current Project)</small>
    image: /assets/img/undermire_image.jpg
    subtitle: <b>1-4 player first person co-op roguelite adventure game with a specific 2D/3D artstyle</b> that was shown on several well known indie trailer showcases such as <a target=”_blank” href="https://www.youtube.com/watch?v=ur00AIPGYqU">Six One Indie Showcase</a> and <a target=”_blank” href="https://www.youtube.com/watch?v=Ia9g1gCTA7w">OTK Games Expo</a>.
    main_text:  In this project, i'm in charge of developing all the network infrastructure required for the game including gameplay synchronization, backend service connections and network specific logic using an own custom made network solution tailor made for the project requirements without stopping the game development. 

