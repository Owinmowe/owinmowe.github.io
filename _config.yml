# Skills settings
skills_title: <u>Developer Skills</u>
skills_description: This are skills i got over the years developing games in learning and professional enviroments.
skills:
  - title: Programming Concepts
    contents:
    - content: Solid knowledge of <b>OOP</b>
    - content: Solid Experience in <b>SOLID</b> and <b>KISS</b> principles.
    - content: Solid Knowledge and experience in <b>programming patterns</b> applied to videogames such as <b>Builder, Factory, Flyweight, Object Pooling, Observer, Command, Service Locator, Strategy</b> and others.
    - content: Knowledge and experience in different architectural patterns such as <b>MVC, MVP or ECS</b>.
    - content: Knowledge and experience in <b>Unit Testing and TDD</b>.
    - content: Knowledge of common game development algorithms such as <b>FSM, Boids, A* pathfinding, Voronoi</b> and many others.
    - content: Knowledge of <b>Algebra y Physics</b> with a strong handling of <b>Vectors, Quaternions, Matrixs, Planes, Collisions</b> and other related mathematical concepts.
    - content: Knowledge of <b>Parallel Programming</b>.
    - content: Knowledge of the rendering pipeline including <b>Shader Programming</b> (Mainly <b>HLSL/GLSL</b>).

  - title: C# Specifics
    contents:
    - content: Solid knowledge of C# specific characterist such as <b>Attributes, STL, LINQ, Lambdas, Predicates, Async/Await, Yield Return</b> and others.
    - content: Knowledge of handling and optimization of memory usage, such as <b>GC</b> functionalities, Struct/Class difference and others.
    - content: Knowledge and experience in <b>Assemblies Handling</b>.
    - content: Knowledge and experience in <b>Reflection</b>.
    - content: Basic Knowledge of <b>WFP</b>. 

  - title: Unity Specifics
    contents:
    - content: Solid Knowledge and experience in all basic systems of the engine.
    - content: Solid Knowledge and experience in all target platforms being <b>Android</b> and <b>WebGL</b> my main expertice.
    - content: Solid Knowledge and experience of <b>assets import and integration pipelines</b>.
    - content: Solid Knowledge and experience of <b>UI Handling</b>, including functionality to resizing to anchors.
    - content: Knowledge and experience with editor scripts such as <b>CustomEditors</b>, <b>EditorWindows</b> and <b>PropertyDrawers</b> in both <b>IMGUI</b> and <b>VisualElement</b> pipelines.
    - content: Knowledge and experience in different Unity Packages such as <b>Addressables</b>, <b>New Input System</b>, <b>Localization</b>, and several others.
    - content: Knowledge and experience in interfaces programming for <b>RESTful API</b> through <b>WebRequests</b>.
    - content: Knowledge and experience in <b>multiplayer games</b> with <b>Mirror/Fusion</b> with different multiplayer architectures.
    - content: Knowledge and experience about all different render pipelines (<b>Built-in, URP, HDRP</b>) including material/shaders handling through <b>HLSL</b> or <b>Shadergraph</b>.
    - content: Knowledge and experience in <b>Unit-Testing</b> for general logic and engine specific logic.


  - title: C++ Specifics
    contents:
    - content: Solid knowledge of memory management with either <b>smart pointers</b> and <b>raw pointers</b>. This includes pointers algebra.
    - content: Solid knowledge of the STL. Mainly using cointainers such as <b>vector, queue, stack, list and enumerators</b>.
    - content: Solid knowledge of <b>Files Handling and exceptions</b>.

  - title: Unreal Specifics
    contents:
    - content: Basic knowledge of the engine, materials and assets imports.
    - content: Basic knowledge of the development workflow using <b>Blueprints and C++</b> in parallel to get the advantages of both.

  - title: Work Methodologies
    contents:
    - content: Solid Knowledge and experience in <b>Agile Principles and Scrum/Kanban Methodologies</b>.
    - content: Solid Knowledge and experience in different project management systems such as <b>Trello, ClickUp and Jira</b>.
    - content: Solid Knowledge and experience in different repository systems <b>(Git/GitLab)</b> and different Git Tools such as <b>GitKraken, SourceTree, GitHub Desktop and GitBash.</b>
    - content: Experience in documentation both internal in code or external by using documentation programs such as <b>Dotxigen</b>.

